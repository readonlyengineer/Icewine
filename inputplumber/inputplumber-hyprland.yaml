# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/device_profile_v1.json
version: 1
kind: DeviceProfile
name: Icewine Hyprland
description: Steam Deck controls translated for the icewine Hyprland session.

target_devices:
  - xbox-elite
  - keyboard
  - mouse
  - touchpad

mapping:
  # Back grips. LeftTop/RightTop cover the aliases used by InputPlumber's
  # default profile; verify exact physical labels on first hardware boot.
  - name: R4
    source_event:
      gamepad:
        button: RightPaddle1
    target_events:
      - keyboard: KeyF13
  - name: R4 alias
    source_event:
      gamepad:
        button: RightTop
    target_events:
      - keyboard: KeyF13
  - name: R5
    source_event:
      gamepad:
        button: RightPaddle2
    target_events:
      - keyboard: KeyF14
  - name: L4
    source_event:
      gamepad:
        button: LeftPaddle1
    target_events:
      - keyboard: KeyF15
  - name: L4 alias
    source_event:
      gamepad:
        button: LeftTop
    target_events:
      - keyboard: KeyF15
  - name: L5
    source_event:
      gamepad:
        button: LeftPaddle2
    target_events:
      - keyboard: KeyF16
